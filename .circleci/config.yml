version: 2.1

executors:
  python-executor:
    docker:
      - image: cimg/python:3.10  # You can adjust the Python version based on your requirements
    working_directory: ~/repo

jobs:
  build_and_push_prod:
    executor: python-executor
    steps:
      - checkout  # Checkout the repository
      - setup_remote_docker:
          version: 20.10.7  # Optional: Set Docker version (if required for your environment)
          docker_layer_caching: true  # Optional: Enable Docker layer caching for faster builds
      - run:
          name: Build and push Docker image for production
          command: |
            docker build -f Dockerfile.prod -t your-dockerhub-username/your-image-name:prod -t your-dockerhub-username/your-image-name:latest .
            echo $DOCKER_PASSWORD | docker login -u $DOCKER_USERNAME --password-stdin
            docker push your-dockerhub-username/your-image-name:prod
            docker push your-dockerhub-username/your-image-name:latest

  build_and_push_staging:
    executor: python-executor
    steps:
      - checkout  # Checkout the repository
      - setup_remote_docker:
          version: 20.10.7  # Optional: Set Docker version (if required for your environment)
          docker_layer_caching: true  # Optional: Enable Docker layer caching for faster builds
      - run:
          name: Build and push Docker image for staging
          command: |
            docker build -f Dockerfile.staging -t your-dockerhub-username/your-image-name:staging .
            echo $DOCKER_PASSWORD | docker login -u $DOCKER_USERNAME --password-stdin
            docker push your-dockerhub-username/your-image-name:staging

workflows:
  version: 2
  build_and_push:
    jobs:
      - build_and_push_prod
      - build_and_push_staging:
          requires:
            - build_and_push_prod
